name: Aikido - CI API Scan

on:
  workflow_dispatch:

jobs:
  aikido-ci-api:
    name: Aikido CI API Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Aikido CI API Client
        run: npm install --global @aikidosec/ci-api-client

      - name: Run Aikido CI API Scan
        env:
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          aikido-api-client scan-release \
            "$REPOSITORY_NAME" \
            "$GITHUB_SHA" \
            --apikey "$AIKIDO_CLIENT_API_KEY" \
            --fail-on-sast-scan \
            --fail-on-iac-scan \
            --fail-on-secrets-scan
